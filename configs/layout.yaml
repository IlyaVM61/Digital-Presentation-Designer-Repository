# Правила вёрстки, которые пользователь вправе изменить.
#
# `conflict_rule` — чему верить, когда шаблон противоречит сам себе.
# Свойство оформления может прийти с разных уровней: из самой разметки, от
# макета, от мастера или из темы файла. Тема расходится с фактическим
# оформлением во всех четырёх проверенных шаблонах: объявляет Arial там, где
# набрано Play. Мастер её обычно повторяет.
#
#   markup   — верить тому, чем шаблон набран на деле (по умолчанию).
#              Свойство с уровня мастера или темы заменяется частотным
#              токеном, и замена записывается в решения колоды.
#   template — верить объявлению шаблона и ничего не заменять.
#
# Обоснование выбора по умолчанию — ADR-0006. Замер на VK Tech: из 774
# прогонов Play задан явно в 610 и унаследован от макета ещё в 93, Arial —
# ровно в одном.
#
# Версия: 1.

version: 1
conflict_rule: markup
