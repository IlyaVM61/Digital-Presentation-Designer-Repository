# Профили визуального регистра — ось различий трёх вариантов (ADR-0004).
#
# Плотность контента отвергнута как ось: при неизменном контенте она
# достижима только перераспределением текста по слайдам, то есть меняет
# генерацию. Цветовая схема отвергнута как единственная ось: в шаблоне её
# вариаций может не быть вовсе, и три варианта оказались бы неразличимы.
#
# Регистр опирается на три признака сразу, поэтому различие сохраняется,
# даже когда шаблон не даёт одного из них.
#
# Версия: 1. Изменения фиксируются здесь же и попадают в отчёт прогона.

version: 1

profiles:
  - id: A
    name: Сдержанный
    # Светлая схема, компактный макет, мелкий кегль, плотная подача.
    prefer_scheme: light
    prefer_families: [content, split]
    size_shift: -1
    layout_offset: 0
    bullet_style: compact

  - id: B
    name: Акцентный
    # Тёмная схема и крупный кегль: тот же контент звучит громче.
    prefer_scheme: dark
    prefer_families: [content, title]
    size_shift: 1
    layout_offset: 1
    bullet_style: spacious

  - id: C
    name: Структурный
    # Разделённые макеты: содержание подаётся блоками, а не сплошным списком.
    prefer_scheme: any
    prefer_families: [split, content]
    size_shift: 0
    layout_offset: 2
    bullet_style: split
