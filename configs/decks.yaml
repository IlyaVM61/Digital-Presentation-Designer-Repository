# Матрица девяти презентаций промежуточной сдачи (T-42).
#
# Три калибровочных шаблона на три варианта вёрстки, на одном контенте —
# docs/08-backlog/deliverables.md. Слаг даёт имя файлам колоды:
# `{slug}__{вариант}`, например `vk-tech__a.pptx`.
#
# Это перечень файлов, а не настройка поведения: сборка у всех шаблонов
# одна и та же, и условие «если шаблон такой-то» здесь невозможно по
# устройству. Относительный путь `file` считается от `templates_dir`,
# `templates_dir` — от корня проекта.
#
# Версия: 1. Изменения фиксируются здесь же.

version: 1

templates_dir: assets/templates/calibration

templates:
  - slug: vk-tech
    file: VK Tech шаблон.pptx
  - slug: vk-workspace
    file: VK_WorkSpace_Клиентская_конференция_Шаблон_03.pptx
  - slug: vk-education
    file: Шаблон презентации VK Education.pptx
