# Пороги проверок аудита. Реестр проверок с обоснованием каждого порога —
# `docs/07-testing/audit-checklist.md`; устройство слоя — `audit-architecture.md`.
#
# Пороги живут здесь, а не в коде: архитектура называет их данными, и на
# защите настраиваемость показывается файлом, а не изменением исходников.
#
# Ключ — идентификатор проверки, внутри — имена параметров её функции.
# Совпадение имён обязательно и проверяется тестом: порог, не совпавший с
# параметром, молча не применяется, и система выглядит настроенной, работая
# на умолчаниях.
#
# Здесь перечислены только реализованные проверки, и то лишь те, у которых
# есть пороги. Ненаписанные появятся вместе со своим кодом: порог без проверки
# настраивает пустоту.
#
# Версия: 1. Изменения фиксируются здесь же и попадают в отчёт прогона.

version: 1

checks:
  # Слайд, выгруженный картинкой вместо объектов, не засчитывается по ТЗ
  # (FR-38). Порог выражен долей холста, а не дюймами: холсты шаблонов
  # различаются — 9144000 против 12192000 EMU при одном 16:9, — и абсолютное
  # значение, откалиброванное на одном, было бы неверным на другом.
  integrity.raster_slide:
    coverage_threshold: 0.95

  # Сколько осей визуального регистра должно сработать, чтобы разница между
  # вариантами читалась. Одной мало: при совпадающих макетах и кеглях
  # различие сводится к цвету, а в шаблоне без цветовых вариаций исчезает и
  # оно (ADR-0004).
  variants.low_distinction:
    min_working_axes: 2

  # --- Вёрстка (T-28) ---

  # Допуск на выход за холст. Координаты — доли, пересчитанные из EMU:
  # точное равенство единице здесь редкость, а находка о выходе на тысячную
  # долю была бы шумом.
  layout.out_of_bounds:
    tolerance: 0.002

  # Допуск пересечения — доля площади меньшего блока (чек-лист: 0,5%).
  # Выражен долей, а не абсолютной величиной: касание соседних слотов после
  # пересчёта долей даёт пересечение в сотые доли процента.
  layout.overlap:
    area_tolerance: 0.005

  # `layout.text_overflow` порогов не имеет: вместимость считается метрикой
  # гарнитуры и кегля — той же, по которой вёрстка принимала решения.

  # Обрезка краем холста: ниже этой доли площади за краем считается
  # погрешностью пересчёта, а не потерей текста.
  layout.text_clipped:
    tolerance: 0.002

  # Направляющие восстанавливаются по краям слотов макета: `viewProps.xml`
  # есть лишь в одном калибровочном шаблоне из трёх. `min_support` — сколько
  # слотов должны разделять край, чтобы он считался линией макета.
  # Уверенность понижена: правило выведено нами, а не прочитано у автора.
  layout.guide_misalign:
    tolerance: 0.005
    min_support: 2
    confidence: 0.6

  # Поля шаблона — квантиль отступов его слотов. Минимум не годится: одного
  # слота вплотную к краю достаточно, чтобы правило исчезло, а такие слоты
  # есть в двух калибровочных шаблонах из трёх.
  layout.margin_violation:
    quantile: 0.1
    confidence: 0.7

  # Отклонение соотношения сторон картинки от исходного (чек-лист: 2%).
  layout.image_distorted:
    aspect_tolerance: 0.02

  # --- Шаблон (T-29) ---

  # `confidence_floor` — уверенность правила, ниже которой находка
  # показывается рекомендацией, а не нарушением. Уверенность берётся у
  # ведущего токена и означает единообразие разметки: шаблон, где ведущая
  # гарнитура набирает 0,2 разметки, о своих правилах почти не сообщает, и
  # обвинять в их нарушении нельзя.
  template.font_not_in_set:
    confidence_floor: 0.4

  # Гарнитуры считаются на слайде, а не в шаблоне (QR-1): в шаблоне их может
  # быть сколько угодно, а слайд, набранный тремя, выглядит собранным наспех.
  template.too_many_faces:
    max_faces: 2

  # Допуск 0,1 pt: кегли в OOXML хранятся в сотых долях пункта, и точного
  # совпадения со шкалой не бывает.
  template.size_not_in_scale:
    tolerance_pt: 0.1

  # ΔE по CIE76. Порог 2 из чек-листа: различие такой величины глаз не
  # замечает, а экспорт и редакторы округляют цвета.
  template.color_not_in_palette:
    delta_e: 2.0
    confidence_floor: 0.4

  # `template.layout_not_from_template` порогов не имеет: макет либо есть в
  # шаблоне, либо нет.

  # Порог уверенности канонической позиции из чек-листа. Позиции постоянных
  # элементов негде взять надёжно: оба мастера VK Tech пусты, изображения
  # разбросаны по макетам. `overlap_tolerance` — доля площади постоянного
  # элемента, начиная с которой содержимое считается занявшим его место.
  template.fixed_element_moved:
    min_confidence: 0.7
    overlap_tolerance: 0.1

  # --- Плотность (T-30) ---

  # Пределы из чек-листа: шесть пунктов на слайд, пятнадцать слов на пункт,
  # таблица 7 × 5, пять рядов на диаграмме. Заголовок в счёт буллетов не
  # входит — иначе предельным числом на деле оказалось бы пять.
  density.too_many_bullets:
    max_bullets: 6

  density.bullet_too_long:
    max_words: 15

  density.table_too_big:
    max_rows: 7
    max_columns: 5

  # Предел рядов не про место, а про цвет: насыщенных цветов в палитре
  # шаблона считанные единицы, и шестой ряд повторит чужой.
  density.too_many_series:
    max_series: 5

  # Заполнение — доля отведённого шаблоном места, занятая содержимым, а не
  # доля холста, покрытая рамками. Обе особенности метрики выведены из
  # рендера: рамка слота втрое больше стоящего в ней текста, а половину
  # холста может занимать графика шаблона, куда содержимому хода нет.
  density.fill_out_of_range:
    min_fill: 0.25
    max_fill: 0.75

  # --- Целостность (T-31) ---

  # `integrity.file_broken` порогов не имеет: файл либо открывается, либо нет.

  # Маркеры заглушек и следов промпта. Список — данные: он зависит от языка
  # колоды и от того, чем пользуется генерация, и правка не должна трогать
  # исходники. Сравнение идёт без учёта регистра по вхождению подстроки.
  integrity.placeholder_text:
    markers:
      - lorem ipsum
      - todo
      - "xxx"
      - вставьте текст
      - ваш текст
      - "{{"
      - "<...>"
      - как языковая модель
      - "system:"

  # `integrity.empty_slide` и `integrity.chart_no_labels` порогов не имеют:
  # содержание либо есть, либо нет; оси либо подписаны, либо нет.

  # Сходство текста, выше которого слайды считаются дублями. Порог из
  # чек-листа: ниже него оказываются слайды одного раздела, у которых
  # совпадает только структура фраз.
  integrity.duplicate_slides:
    similarity: 0.9

  # --- Контраст (T-32) ---

  # Порог 4,5:1 из Приложения 1. Крупный текст держится 3:1 — так устроен
  # сам стандарт, на который мы ссылаемся: брендовый синий VK на белом даёт
  # 4,13:1, и для заголовка в 32 пункта это норма, а для основного текста
  # нарушение. Требовать от заголовка 4,5:1 значило бы противоречить
  # стандарту, которым проверка обоснована.
  template.contrast_low:
    min_ratio: 4.5
    large_text_pt: 24
    large_text_ratio: 3.0

  # --- Валидация контента, аудит текста до вёрстки (T-51) ---

  # Детерминированная половина вопроса 7: маркеры служебного текста. Кроме
  # них проверка ловит фигурные скобки — след незаполненного шаблона
  # подстановки — и текст, оборванный на полуслове. Остальное находит модель.
  # Часть маркеров совпадает с `integrity.placeholder_text`: та смотрит на
  # свёрстанный слайд, эта — на текст до вёрстки, когда его ещё дёшево
  # перегенерировать.
  content.service_garbage:
    markers:
      - как языковая модель
      - как ии-модель
      - as an ai
      - "system:"
      - "user:"
      - "assistant:"
      - "<|"
      - "<think"
      - заметки докладчика
      - заметки спикера
      - speaker notes
      - sourcerefs
      - keymessage
      - "[content.md"
    endings:
      - "..."
      - "…"

  # Вопрос 9. Фраза на другом языке — та, где слов чужого алфавита не меньше
  # `min_words` и их доля больше `max_share`. Порог по числу слов — из-за
  # названий: «VK WorkSpace» или «LibreOffice» внутри русской фразы не
  # делают её английской.
  content.mixed_language:
    min_words: 3
    max_share: 0.5

# Настройки починки (T-34). Не пороги проверок, поэтому отдельным разделом.
#
# Итерация — одно применённое исправление с последующим пересчётом аудита.
# Предел нужен против исправления, которое не устраняет собственную находку:
# без него система переставляла бы блок по кругу. Остаточные находки после
# предела показываются как есть.
fixer:
  max_iterations: 10
